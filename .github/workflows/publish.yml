name: publish

# Publishes the three packages to GitHub Packages when a version tag is pushed.
#
# The version comes from the tag, not from a file someone might forget to bump: a tag of
# v0.1.0 publishes 0.1.0. Tagging is therefore the deliberate act, and an engine that says
# it depends on RulesKernel 0.1.0 is naming something immutable.
#
# The gate runs first. A package that has not passed ./scripts/validate.sh full is not
# publishable, because a broken kernel published once is referenced forever.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned SDK version
        id: sdk
        run: echo "version=$(python3 -c 'import json;print(json.load(open("global.json"))["sdk"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Validate before publishing
        env:
          CI: "true"
        run: ./scripts/validate.sh full

      - name: Resolve the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          CI: "true"
        run: |
          dotnet pack RulesKernel.slnx -c Release --no-build \
            -p:Version="${{ steps.version.outputs.value }}" -o artifacts

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
