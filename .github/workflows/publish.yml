name: publish

# Publishes the four packaged assemblies to nuget.org.
#
# nuget.org rather than GitHub Packages, deliberately. GitHub Packages cannot serve NuGet
# anonymously even for a public package, and a workflow's GITHUB_TOKEN is scoped to its own
# repository -- so every engine built on this kernel would have needed a personal access
# token as a repository secret just to restore it. A kernel whose entire purpose is being
# referenced by many independent repositories must be restorable without a credential.
#
# The version comes from the pushed tag, and the tag must agree with the version MSBuild
# actually resolves for every packable project (checked below) before anything is packed.
# Comparing it to <VersionPrefix> alone was not enough once main began carrying a
# prerelease suffix; see that step's comment. Earlier this workflow
# packed with `-p:Version=<tag>` on top of a build whose assembly already had a different
# version baked in from Directory.Build.props -- so pack RELABELLED the package without
# rebuilding, and a package stamped e.g. 0.3.0 could ship an assembly whose
# AssemblyInformationalVersion said 0.2.0. For a library whose product is replay identity,
# a package that disagrees with its own assembly about its version is a provenance defect,
# not a cosmetic one. The fix: the tag is the review gate (VersionPrefix is a normal,
# reviewed source change; pushing a tag that doesn't match it is a mistake, not a release),
# and nothing overrides the version at pack time -- the package and the assembly can only
# ever agree, because they come from the same build.
#
# Authentication is NuGet Trusted Publishing: the workflow proves its identity to nuget.org
# with a short-lived OIDC token minted by GitHub for this repository and this workflow file,
# and exchanges it for an API key valid for minutes. There is no long-lived secret to store,
# leak, or rotate -- and a stolen key is useless, because nuget.org will only accept one
# issued to this exact repository and workflow.
#
# The gate runs first, in its own job, and `id-token: write` is granted only to the job
# that comes after it. That job re-checks out the ref and rebuilds Release from scratch
# (see the `publish` job below) rather than reusing anything from `validate`: the two jobs
# run on different runners with no shared filesystem, and rebuilding is also what lets
# `publish` be a small, auditable sequence (restore, build, pack, login, push) rather than
# the full gate -- which runs arbitrary repo-controlled Python and executes this
# repository's own test assemblies -- while a live OIDC-minting credential is sitting in
# the job's permissions. A published version can be unlisted but never deleted, so the gate
# still has to pass before any of this runs; it just does not need to run *holding
# id-token: write* to do that.

on:
  push:
    tags: ["v*"]
  # A manual re-run exists for retrying a publish that failed after the gate already
  # passed (e.g. a transient OIDC/nuget.org failure) -- it does not accept an arbitrary
  # version. It must be launched with a tag selected as the ref (GitHub's workflow_dispatch
  # ref-picker allows a branch too; the "require a tag" and resolved-version steps below fail
  # loudly, before anything is built or packed, if a branch or a non-matching tag was
  # picked instead). This is the constraint the previous free-text `version` input did not
  # have: that input let the workflow publish any version string, from any ref, including a
  # branch whose HEAD had nothing to do with that version.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See build-and-test.yml for why: validate.sh full runs repo-controlled shell,
          # Python and MSBuild/test code, which has no legitimate reason to find a
          # credential sitting in .git/config.
          persist-credentials: false

      # tools/repo-checks.py's `parseable` check verifies every YAML file actually parses.
      # A malformed workflow is not an error on GitHub -- the workflow simply does not run --
      # so this is the check that notices CI silently ceasing to exist. It reports a file as
      # NOT VERIFIED rather than ok when PyYAML is missing, which is the honest answer and a
      # failure, so the runner must actually have it.
      - name: Ensure PyYAML is available to the repository checks
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Read the pinned SDK version
        id: sdk
        run: echo "version=$(python3 -c 'import json;print(json.load(open("global.json"))["sdk"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Validate before publishing
        env:
          CI: "true"
        run: ./scripts/validate.sh full

      # The release-only half of the gate, and the only place it runs. A non-empty
      # PublicAPI.Unshipped.txt is the normal, correct state of a branch in flight, so this
      # cannot live in validate.sh or in repo-checks.py without failing ordinary
      # development -- tools/release-checks.py's module docstring says so at length. At a
      # tag the obligation inverts: everything being packed is about to become API a
      # consumer can compile against, so none of it may still be classified as unshipped.
      # v0.2.0 went out with all 158 declarations of the three released packages still in
      # Unshipped, which is why this step exists.
      #
      # It runs here in `validate`, which finishes before `publish` starts, so it is
      # satisfied before anything is built or packed -- and it stays out of the job that
      # holds `id-token: write`, for the reason the header comment gives.
      - name: Require every public API baseline to be promoted
        run: tools/release-checks.py

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # Required to mint the OIDC token Trusted Publishing exchanges for a short-lived API
      # key. Scoped to this job only -- the `validate` job above, which is where arbitrary
      # repo-controlled code actually runs, never has it.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a tag of the form vX.Y.Z
        id: version
        run: |
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "::error::publish must run from a tag (refs/tags/vX.Y.Z), not '${{ github.ref }}' (ref_type=${{ github.ref_type }}). If this was a manual run, re-run workflow_dispatch with that tag selected as the ref."
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' is not of the form vX.Y.Z"
            exit 1
          fi

          echo "value=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Read the pinned SDK version
        id: sdk
        run: echo "version=$(python3 -c 'import json;print(json.load(open("global.json"))["sdk"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      # The tag must equal the version the packages will actually carry -- which is what
      # MSBuild resolves, not what Directory.Build.props spells in one element.
      #
      # This step used to compare the tag to <VersionPrefix> alone, and that was a real
      # hole the moment main started carrying a prerelease suffix: a tree with
      # VersionPrefix 0.3.0 + VersionSuffix dev passes a prefix comparison under tag
      # v0.3.0, and then publishes 0.3.0-dev. A package whose version disagrees with the
      # tag it was cut from is the same class of provenance defect as the relabelled-pack
      # bug this workflow's header describes: for a library whose product is replay
      # identity, "which commit is 0.3.0" must have exactly one answer, permanently.
      # nuget.org will not let it be corrected afterwards -- a published version can be
      # unlisted, never deleted.
      #
      # Asking MSBuild is the point. PackageVersion is the property `dotnet pack` stamps,
      # so a prefix, a suffix, a per-project override or anything else a future property
      # introduces is already folded into the answer; nothing here re-implements MSBuild's
      # resolution and then drifts from it. Evaluation only -- no restore, no build -- so
      # it runs before either, and the comparison is exact string equality, which is what
      # makes "the resolved version carries a suffix the tag does not" fail rather than
      # pass.
      #
      # Scope comes from disk, not from a list: every csproj, minus the ones MSBuild says
      # are not packable. A packable project added later is covered without anyone
      # remembering to add it here, and a step that found nothing to examine fails rather
      # than reporting success, because a version gate that proved nothing is worse than
      # none.
      - name: Require every packable project's resolved version to equal the tag
        env:
          TAG: ${{ github.ref_name }}
          TAG_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          tag, expected = os.environ["TAG"], os.environ["TAG_VERSION"]
          ignored = {"bin", "obj", "artifacts", ".git"}

          examined, problems = 0, []
          for csproj in sorted(pathlib.Path(".").rglob("*.csproj")):
              if any(part in ignored for part in csproj.parts):
                  continue
              evaluated = json.loads(subprocess.run(
                  ["dotnet", "msbuild", str(csproj), "-getProperty:IsPackable",
                   "-getProperty:PackageVersion", "-nologo"],
                  check=True, capture_output=True, text=True,
              ).stdout)["Properties"]

              if evaluated["IsPackable"].strip().lower() == "false":
                  continue
              examined += 1
              resolved = evaluated["PackageVersion"].strip()
              print(f"{csproj}: {resolved}")
              if resolved != expected:
                  problems.append(
                      f"{csproj} resolves to {resolved!r}, but the tag says {expected!r}"
                  )

          if not examined:
              print("::error::no packable project was found, so this gate proved nothing "
                    "about what is about to be published", file=sys.stderr)
              sys.exit(1)

          if problems:
              for problem in problems:
                  print(f"::error::{problem}", file=sys.stderr)
              print(f"::error::tag {tag} does not describe what would be packed. The "
                    "release PR clears <VersionSuffix> and sets <VersionPrefix> to the "
                    "version being released; main carries the next version WITH a suffix, "
                    "so a development tree can never be tagged as a release. See CLAUDE.md, "
                    "'The release cycle'.", file=sys.stderr)
              sys.exit(1)

          print(f"{examined} packable project(s) resolve to {expected}, matching {tag}")
          PY

      # This job runs on a fresh checkout with no shared filesystem from `validate`'s
      # runner, so the Release build that gets packed has to happen here. It is built the
      # same way validate.sh's Release pass builds it -- CI=true, so
      # ContinuousIntegrationBuild applies the same source-path normalisation to the
      # binaries that ship as it did to the binaries validate.sh just tested. Restoring
      # with --locked-mode keeps this build using exactly the resolved graph validate.sh
      # already verified, not a fresh resolution.
      - name: Restore (locked)
        run: dotnet restore RulesKernel.slnx --locked-mode

      - name: Build Release (CI=true, same as validate.sh's shipping pass)
        env:
          CI: "true"
        run: dotnet build RulesKernel.slnx -c Release --no-restore -warnaserror

      - name: Pack
        env:
          CI: "true"
        # No -p:Version override: VersionPrefix in Directory.Build.props already equals
        # the tag (enforced above), so the package version comes from the same build that
        # produced the assembly, and the two cannot disagree.
        run: dotnet pack RulesKernel.slnx -c Release --no-build -o artifacts

      - name: Exchange the OIDC token for a short-lived API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: brandonifco

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
