name: publish

# Publishes the three packages to nuget.org.
#
# nuget.org rather than GitHub Packages, deliberately. GitHub Packages cannot serve NuGet
# anonymously even for a public package, and a workflow's GITHUB_TOKEN is scoped to its own
# repository -- so every engine built on this kernel would have needed a personal access
# token as a repository secret just to restore it. A kernel whose entire purpose is being
# referenced by many independent repositories must be restorable without a credential.
#
# The version comes from the tag, not from a file someone might forget to bump: a tag of
# v0.1.0 publishes 0.1.0. workflow_dispatch takes an explicit version instead, so a release
# can be re-published without rewriting history.
#
# Authentication is NuGet Trusted Publishing: the workflow proves its identity to nuget.org
# with a short-lived OIDC token minted by GitHub for this repository and this workflow file,
# and exchanges it for an API key valid for minutes. There is no long-lived secret to store,
# leak, or rotate -- and a stolen key is useless, because nuget.org will only accept one
# issued to this exact repository and workflow.
#
# The gate runs first. A package that has not passed ./scripts/validate.sh full is not
# publishable, because a published version can be unlisted but never deleted.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without a leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: read
  # Required to mint the OIDC token Trusted Publishing exchanges for a short-lived API key.
  # Without it the login step fails; it grants nothing else.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned SDK version
        id: sdk
        run: echo "version=$(python3 -c 'import json;print(json.load(open("global.json"))["sdk"]["version"])')" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Validate before publishing
        env:
          CI: "true"
        run: ./scripts/validate.sh full

      - name: Resolve the version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            value="${{ github.event.inputs.version }}"
          else
            value="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$value' is not a semantic version"
            exit 1
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          CI: "true"
        run: |
          dotnet pack RulesKernel.slnx -c Release --no-build \
            -p:Version="${{ steps.version.outputs.value }}" -o artifacts

      - name: Exchange the OIDC token for a short-lived API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: brandonifco

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
