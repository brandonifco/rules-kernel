name: pcg-vectors

# tools/pcg-vectors/generate.sh --check re-derives the committed PCG32 reference vectors
# from the pinned upstream commit (imneme/pcg-c-basic) and diffs them against
# tests/RulesKernel.Randomness.Tests/Pcg32ReferenceVectors.cs. It is deliberately excluded
# from ./scripts/validate.sh, which is hermetic by design (no network, no C compiler
# requirement) -- but that means nothing runs it unless something like this workflow does.
# As docs/decisions/0005 puts it: the vectors are the replay contract, and a wrong vector
# does not fail -- it passes, forever, until something actually re-derives it and looks.
#
# This workflow is that "something": a weekly re-derivation, an on-demand one, and one on
# every pull request or push that touches the vectors, the recipe, or the generator they pin.
# It needs network (to fetch the pinned upstream files), a C compiler, and sha256sum -- all
# present on ubuntu-24.04's default image without extra setup.
#
# The change trigger exists because weekly was the wrong half of "a wrong vector passes
# forever" (#67): the dangerous edit is a vector rewritten to agree with a broken generator,
# and a weekly run reports it only after it has merged. On a pull request that touches those
# files, a failure is now visible before the merge.
#
# It is still NOT a required check. Treating an upstream-fetch failure (network hiccup,
# GitHub raw outage) as merge-blocking would make every such PR flaky for a reason unrelated
# to it. A red run here means "go look before merging", not an automatic block.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/RulesKernel.Randomness/**"
      - "tests/RulesKernel.Randomness.Tests/Pcg32ReferenceVectors.cs"
      - "tools/pcg-vectors/**"
      - ".github/workflows/pcg-vectors.yml"
  push:
    branches: [main]
    paths:
      - "src/RulesKernel.Randomness/**"
      - "tests/RulesKernel.Randomness.Tests/Pcg32ReferenceVectors.cs"
      - "tools/pcg-vectors/**"
      - ".github/workflows/pcg-vectors.yml"
  schedule:
    # Weekly. Cron is UTC; day-of-week 1 = Monday.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Re-derive and compare against the committed fixture
        run: tools/pcg-vectors/generate.sh --check
