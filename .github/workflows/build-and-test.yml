name: build-and-test

# This repository has exactly one definition of "acceptable": ./scripts/validate.sh full.
# This workflow calls it and does nothing else of substance. Reimplementing the recipe here
# would create a second definition that drifts from the first.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    # The owner's own runs go to the factory-ci VM (rules-factory's execution-trust decision,
    # 0080); forks and bots run hosted on a fixed release, not the ubuntu-latest alias: that alias
    # has jumped Ubuntu releases before, and each jump silently changes the toolchain underneath a
    # build whose central claim is reproducibility. There is no hosted default
    # (rules-factory's no-hosted-default decision, 0087): without FACTORY_RUNS_ON_TRUSTED the job
    # fails at once.
    runs-on: ${{ fromJSON(vars.FACTORY_RUNS_ON_TRUSTED == '["self-hosted","linux","x64","factory-ci"]' && !vars.FACTORY_RUNS_ON && (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event.pull_request.head.repo.full_name || !github.event.pull_request && github.repository) == github.repository && '["self-hosted","linux","x64","factory-ci"]' || '"ubuntu-24.04"') || vars.FACTORY_RUNS_ON == '["self-hosted","linux","x64","factory-ci"]' && !vars.FACTORY_RUNS_ON_TRUSTED && '["self-hosted","linux","x64","factory-ci"]' || vars.FACTORY_RUNS_ON == '"ubuntu-24.04"' && !vars.FACTORY_RUNS_ON_TRUSTED && '"ubuntu-24.04"' || '{"group":"FACTORY_RUNS_ON or FACTORY_RUNS_ON_TRUSTED is unset or invalid"}') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # validate.sh full then runs repo-controlled shell, Python (tools/repo-checks.py)
          # and MSBuild targets/test code from this checkout. None of that needs to push,
          # tag, or otherwise write to the remote, so there is no reason for a credential
          # capable of doing so to sit in .git/config while it runs. This does not shrink
          # `permissions: contents: read` above -- it removes the *token material itself*
          # from the working tree, which matters against repo-controlled code specifically,
          # not against the GitHub API.
          persist-credentials: false

      # tools/repo-checks.py's `parseable` check verifies every YAML file actually parses.
      # A malformed workflow is not an error on GitHub -- the workflow simply does not run --
      # so this is the check that notices CI silently ceasing to exist. It reports a file as
      # NOT VERIFIED rather than ok when PyYAML is missing, which is the honest answer and a
      # failure, so the runner must actually have it.
      - name: Ensure PyYAML is available to the repository checks
        run: python3 -m pip install --quiet --disable-pip-version-check --require-hashes -r tools/requirements.txt

      - name: Read the pinned SDK version
        id: sdk
        run: echo "version=$(python3 -c 'import json;print(json.load(open("global.json"))["sdk"]["version"])')" >> "$GITHUB_OUTPUT"

      # Two versions, for two different reasons. The pinned one is what global.json
      # requires and what everything is built with. The 8.0.131 install is there purely for
      # its RUNTIME (8.0.31): tools/package-probe/check.sh executes a real net8.0 consumer against
      # the packed packages, and with no .NET 8 runtime on the box it would honestly report
      # `skip` for that framework and prove nothing -- on the exact half of the
      # docs/decisions/0008 commitment that was broken in 0.1.0 and is the reason the probe
      # exists. global.json pins 10.0.112 with rollForward disabled, so the extra SDK
      # cannot change which one builds this repository.
      # The version is exact, not a floating 8.0.x: an exact version is reproducible, and the
      # factory-ci VM's toolchain is read-only, so it cannot follow 8.0.x (today 8.0.425; the
      # next patch would make the job try to install into a read-only directory). 8.0.131
      # carries the same 8.0.31 runtime the probe needs.
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.131
            ${{ steps.sdk.outputs.version }}

      - name: Validate
        env:
          CI: "true"
        run: ./scripts/validate.sh full
