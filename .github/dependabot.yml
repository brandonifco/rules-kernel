# Dependency update policy for this repository.
#
# Without this file, an advisory against Microsoft.NET.Test.Sdk, xunit,
# xunit.runner.visualstudio, or any pinned GitHub Action SHA has no path to surface here:
# nothing watches for it. This does not itself guarantee updates get merged -- these are
# still ordinary PRs subject to ./scripts/validate.sh full -- it only guarantees someone is
# told an update exists.
#
# Grouped and monthly rather than the defaults (ungrouped, as-soon-as-possible): a stream
# of single-package PRs each showing a one-line version bump trains reviewers to merge on
# reflex rather than read the changelog. One grouped PR per ecosystem per month is small
# enough to actually review.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    # Microsoft.CodeAnalysis.CSharp is pinned to the OLDEST Roslyn the analyzer must load
    # under, not the newest (Directory.Packages.props, docs/decisions/0011). Dependabot's first
    # grouped PR proposed 4.8.0 -> 5.9.0, which would lock out every consumer on SDK 8.0.x.
    # Patch releases of the floor are still proposed.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  # tools/requirements.txt: PyYAML, hash-pinned, for the repository checks.
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "monthly"
    groups:
      pip-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
